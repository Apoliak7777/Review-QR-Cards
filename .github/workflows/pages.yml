# Kontrola webu pri každom pushi, nasadenie na GitHub Pages iba z predvolenej vetvy.
# Jednorazové nastavenie: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Web

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kontrola odkazov a zástupných textov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_site.py

  deploy:
    name: Nasadenie na GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      # Publikujú sa iba súbory webu, nie README, nástroje ani nastavenia repozitára.
      - name: Pripraviť súbory webu
        env:
          ZDROJ_URL: https://apoliak7777.github.io/Review-QR-Cards
          WEB_URL: ${{ steps.pages.outputs.base_url }}
          WEB_CESTA: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir _site
          git ls-files -z -- . ':(exclude)README.md' ':(exclude).github' ':(exclude)tools' ':(exclude)_headers' ':(exclude).gitignore' \
            | xargs -0 cp --parents -t _site
          WEB_URL="${WEB_URL%/}"
          WEB_CESTA="${WEB_CESTA%/}"
          # Absolútne adresy (canonical, hreflang, og:, JSON-LD, sitemap, robots) vždy ukazujú na skutočnú
          # adresu webu. Po pripojení vlastnej domény v Settings → Pages sa prepnú samy, v kóde netreba nič meniť.
          if [ -n "$WEB_URL" ] && [ "$WEB_URL" != "$ZDROJ_URL" ]; then
            grep -rlF "$ZDROJ_URL" _site | xargs -r sed -i "s#${ZDROJ_URL}#${WEB_URL}#g"
          fi
          # 404.html používa cesty od koreňa (/assets/…). Bez vlastnej domény beží web v podpriečinku, tak ho doplníme.
          if [ -n "$WEB_CESTA" ]; then
            sed -i -E "s#(href|src)=\"/#\1=\"${WEB_CESTA}/#g" _site/404.html
          fi
          echo "Adresa webu: ${WEB_URL}/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
