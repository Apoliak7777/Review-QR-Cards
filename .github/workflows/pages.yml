# Kontrola webu pri každom pushi, nasadenie na GitHub Pages iba z predvolenej vetvy.
# Jednorazové nastavenie: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Web

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kontrola odkazov a zástupných textov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_site.py

  deploy:
    name: Nasadenie na GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Publikujú sa iba súbory webu, nie README, nástroje ani nastavenia repozitára.
      - name: Pripraviť súbory webu
        run: |
          mkdir _site
          git ls-files -z -- . ':(exclude)README.md' ':(exclude).github' ':(exclude)tools' ':(exclude)_headers' \
            | xargs -0 cp --parents -t _site
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
